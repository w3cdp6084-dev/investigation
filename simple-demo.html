<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSAP Scramble Text - Simple Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
        }

        body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .text-block {
            margin: 15vw;
            max-width: 800px;
            font-family: "Space Mono", monospace;
            font-weight: 400;
            font-style: normal;
            font-size: clamp(16px, 4vw, 40px);
            color: #fff;
        }

        .char {
            will-change: transform;
        }
    </style>
</head>
<body>
    <div class="text-block">
        <p>
            Move your cursor over this text to see the scramble effect in action.
            The characters will animate when your mouse gets close to them.
            This is a demonstration of GSAP's SplitText and ScrambleText plugins.
        </p>
    </div>

    <!-- GSAP and Plugins -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://unpkg.com/gsap@3.12.5/dist/SplitText.min.js"></script>
    <script src="https://unpkg.com/gsap@3.12.5/dist/ScrambleTextPlugin.min.js"></script>

    <script>
        const st = SplitText.create("p", { type: "chars", charsClass: "char" });

        st.chars.forEach((char) => {
            gsap.set(char, { attr: { "data-content": char.innerHTML } });
        });

        const textBlock = document.querySelector(".text-block");

        textBlock.onpointermove = (e) => {
            st.chars.forEach((char) => {
                const rect = char.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dx = e.clientX - cx;
                const dy = e.clientY - cy;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 100)
                    gsap.to(char, {
                        overwrite: true,
                        duration: 1.2 - dist / 100,
                        scrambleText: {
                            text: char.dataset.content,
                            chars: ".:",
                            speed: 0.5,
                        },
                        ease: 'none'
                    });
            });
        };
    </script>
</body>
</html>
